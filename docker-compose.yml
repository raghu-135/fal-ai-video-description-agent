services:
  video-description-web-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: fal-video-description-web:dev
    environment:
      FAL_KEY: ${FAL_KEY}
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
    command: ["src.app.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]
